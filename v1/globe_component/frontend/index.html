<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>GeoLite Globe</title>
<style>
  :root {
    --bg: #0a0e16;
    --panel: #121a28;
    --border: #263248;
    --text: #d7e1ee;
    --muted: #8ea0b8;
    --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }

  #tooltip {
    position: fixed; z-index: 40; pointer-events: none;
    background: rgba(15, 21, 32, 0.95);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 9px; font-size: 12px; color: var(--text);
    max-width: 280px; display: none;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
  }
  #tooltip .tt-title { font-weight: 600; }
  #tooltip .tt-sub { color: var(--muted); margin-top: 1px; }

  #menu {
    position: fixed; z-index: 50; min-width: 190px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 4px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
    display: none;
  }
  #menu .menu-header {
    padding: 6px 10px 5px; color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border); margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px;
  }
  #menu .menu-item {
    padding: 7px 10px; border-radius: 5px; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  #menu .menu-item:hover { background: #1b2740; }
  #menu .menu-item .mi-icon { color: var(--accent); width: 14px; text-align: center; }

  #chips, #chips-tr {
    position: fixed; z-index: 30; display: flex; flex-direction: column; gap: 6px;
    pointer-events: none;
  }
  #chips { top: 10px; left: 10px; }
  #chips-tr { top: 10px; right: 10px; align-items: flex-end; }
  .chip {
    background: rgba(15, 21, 32, 0.85); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 12px; font-size: 11.5px; color: var(--muted);
  }
  .chip b { color: var(--text); font-weight: 600; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
  <div id="app"></div>
  <div id="chips"></div>
  <div id="chips-tr"></div>
  <div id="tooltip"></div>
  <div id="menu"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
